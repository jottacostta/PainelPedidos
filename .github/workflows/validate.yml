name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check HTML structure and inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          p = Path('index.html')
          if not p.is_file() or p.stat().st_size == 0:
              raise SystemExit('index.html ausente ou vazio')
          text = p.read_text(encoding='utf-8-sig')
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.html = self.head = self.body = False
              def handle_starttag(self, tag, attrs):
                  if tag == 'html': self.html = True
                  if tag == 'head': self.head = True
                  if tag == 'body': self.body = True
          parser = Check()
          parser.feed(text)
          parser.close()
          if not all((parser.html, parser.head, parser.body)):
              raise SystemExit('Estrutura HTML básica inválida: esperado html, head e body')
          scripts = re.findall(r'<script\b(?![^>]*\bsrc\s*=)[^>]*>(.*?)</script\s*>', text, flags=re.I | re.S)
          Path('/tmp/inline-scripts').mkdir(exist_ok=True)
          for i, script in enumerate(scripts):
              Path(f'/tmp/inline-scripts/{i}.js').write_text(script, encoding='utf-8')
          print(f'HTML básico OK; {len(scripts)} bloco(s) de script inline encontrados.')
          PY
          for file in /tmp/inline-scripts/*.js; do
            [ -e "$file" ] || continue
            node --check "$file"
          done
