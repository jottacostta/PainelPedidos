name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conferir versão por par de PRs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          anchor = '067c7b330cef3593092e1244cfe8eb03f8e037cc'
          parent = os.environ.get('BASE_SHA')
          history = subprocess.check_output(['git', 'log', '--first-parent', '--format=%s', anchor + '..' + (parent or 'HEAD')], text=True)
          count = sum(bool(re.search(r'\(#\d+\)$|^Merge pull request #\d+\b', title)) for title in history.splitlines()) + bool(parent)
          version = 'V' + str(25 + count // 2)
          for file, pattern in [('index.html', r'<footer>[^<]*Versão (V\d+)'), ('README.md', r'^# .*Reposição (V\d+)')]:
              found = re.search(pattern, Path(file).read_text())
              if not found or found[1] != version:
                  raise SystemExit(f'{file}: use {version} para a integração número {count} após a PR #30.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check HTML and JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8-sig')
          class Check(HTMLParser):
              def __init__(self): super().__init__(); self.tags=set()
              def handle_starttag(self,t,a): self.tags.add(t)
          p=Check();p.feed(s)
          assert {'html','head','body'}.issubset(p.tags)
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script\s*>',s,re.I|re.S)
          app_scripts = [script for script in scripts if 'use strict' in script]
          assert app_scripts, 'No inline application script found'
          Path('/tmp/inline.js').write_text('\n;\n'.join(app_scripts), encoding='utf-8')
          PY
          node --check /tmp/inline.js
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          node tests/smoke.cjs
