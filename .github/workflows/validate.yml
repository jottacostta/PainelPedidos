name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check HTML and JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8-sig')
          class Check(HTMLParser):
              def __init__(self): super().__init__(); self.tags=set()
              def handle_starttag(self,t,a): self.tags.add(t)
          p=Check();p.feed(s)
          assert {'html','head','body'}.issubset(p.tags)
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script\s*>',s,re.I|re.S)
          app_scripts = [script for script in scripts if 'use strict' in script]
          assert app_scripts, 'No inline application script found'
          Path('/tmp/inline.js').write_text('\n;\n'.join(app_scripts), encoding='utf-8')
          PY
          node --check /tmp/inline.js
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          node tests/smoke.cjs
